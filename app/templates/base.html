<!DOCTYPE html>
<html>
<head>
    {% block head %}
    <title>{% block title %}{% endblock %} | Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/vendor/spectre-0.5.8/spectre.min.css') }}">
    <!-- useful to build internal urls in javascript files without having to render with Jinja; see https://flask.palletsprojects.com/en/stable/patterns/javascript/ -->
    <script>const SCRIPT_ROOT = {{ request.script_root|tojson }};</script>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/hypnos.css') }}">
    {% endblock head %}
</head>
<body>
    <!-- grid-md is a fixed-width container (840px) -->
    <div class="container grid-md">
    <header class="navbar">
        <section class="navbar-section">
            <a href="{{url_for('homepage')}}" class="navbar-brand mr-10">Hypnos</a>
            <a href="{{url_for('show_nights')}}" class="btn btn-link">Nuits</a>
            <a href="{{url_for('show_places')}}" class="btn btn-link">Lieux</a>
        </section>
        <section class="navbar-section">
        </section>
    </header>
    <div class="columns">
    {% block content %}
    {% endblock %}
    </div>
    </div>
</body>
</html>
